<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon GO Completion Tracker</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Hide scrollbar for filter container but allow swipe */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20 min-h-screen flex flex-col">

    <div id="loading-state" class="flex-1 flex flex-col items-center justify-center p-4 min-h-screen">
        <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-lg text-slate-600 font-medium">Loading Pokedex Data...</p>
    </div>

    <div id="error-state" class="hidden flex-1 flex-col items-center justify-center p-4 min-h-screen">
        <div class="bg-red-50 border-l-4 border-red-500 p-6 rounded-lg max-w-md w-full shadow-sm">
            <h3 class="text-red-800 font-bold text-lg mb-2">Error Loading Data</h3>
            <p id="error-message" class="text-red-600"></p>
        </div>
    </div>

    <div id="app-content" class="hidden flex-col">
        <!-- Sticky Header -->
        <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md shadow-sm border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <!-- Title and Category Selector -->
                    <div class="flex-1 flex flex-col sm:flex-row sm:items-center gap-3">
                        <h1 class="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2 shrink-0">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-sm shadow-inner">
                                GO
                            </div>
                            Tracker
                        </h1>
                    </div>

                    <!-- Progress Bar Visual -->
                    <div class="w-full md:w-1/3 flex flex-col gap-1">
                        <div class="flex justify-between items-center text-sm font-semibold">
                            <span class="text-slate-500">
                                <span id="caught-count" class="text-slate-800">0</span> / <span id="total-count">0</span>
                            </span>
                            <span id="progress-percentage-text" class="text-blue-600">0%</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                            <div id="progress-bar-fill" class="bg-blue-500 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 flex flex-col gap-3">
                    <div class="relative w-full">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input
                            type="text"
                            id="search-input"
                            placeholder="Search Pokemon..."
                            class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-transparent rounded-lg focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-colors text-slate-700 placeholder-slate-400 outline-none"
                        />
                    </div>
                    
                    <div class="flex items-center gap-2 p-1.5 bg-slate-100 rounded-lg overflow-x-auto no-scrollbar w-full" id="filter-and-track-bar">
                        <!-- Status Filters -->
                        <button data-filter="all" class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all bg-white text-blue-600 shadow-sm shrink-0">All</button>
                        <button data-filter="caught" class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">Caught</button>
                        <button data-filter="missing" class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">Missing</button>
                        
                        <div class="w-px h-6 bg-slate-300 mx-1 shrink-0"></div>
                        
                        <!-- Tracking Categories -->
                        <button data-track="regular" class="track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all bg-white text-slate-800 shadow-sm shrink-0">Regular</button>
                        <button data-track="shiny" class="track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">✨ Shiny</button>
                        <button data-track="hundo" class="track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">💯 100%</button>
                        <button data-track="lucky" class="track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">🍀 Lucky</button>
                        <button data-track="xxl" class="track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">🐘 XXL</button>
                        <button data-track="xxs" class="track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">🐁 XXS</button>
                        <button data-track="shadow" class="track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">😈 Shadow</button>
                        <button data-track="purified" class="track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">🕊️ Purified</button>
                        <button data-track="mega" class="track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">🧬 Mega</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
            
            <!-- Bulk Action Context Menu -->
            <div id="bulk-actions" class="hidden mb-4 items-center justify-between bg-white border border-slate-200 p-3 rounded-lg shadow-sm">
                <span id="results-count" class="text-sm text-slate-600 font-medium"></span>
                <button id="mark-all-btn" class="text-xs font-bold bg-slate-100 border border-slate-200 text-slate-700 px-3 py-1.5 rounded hover:bg-slate-200 transition-colors">
                    Mark All
                </button>
            </div>

            <div id="empty-state" class="hidden text-center py-20">
                <div class="inline-block p-6 bg-white rounded-full shadow-sm mb-4">
                    <span class="text-4xl">🔍</span>
                </div>
                <h2 class="text-xl font-semibold text-slate-700">No Pokémon found</h2>
                <p class="text-slate-500 mt-1">Try adjusting your search or filters.</p>
            </div>

            <!-- Pokemon Grid -->
            <div id="pokemon-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
                <!-- Javascript will inject cards here -->
            </div>
        </main>
    </div>

    <script>
        // State Management
        let pokemonList = [];
        let filteredList = [];
        
        // userData structure: { id: { regular: true, shiny: false, hundo: true, ... } }
        let userProgress = {}; 
        
        let searchTerm = '';
        let filterMode = 'all';
        let trackingCategory = 'regular'; // What the top progress bar is tracking

        // Hardcoded list of Mega-eligible Pokedex Numbers (up to recent releases)
        // Used to only show the "Mega" toggle on Pokemon that actually have one.
        const megaEligibleIds = new Set([
            3, 6, 9, 15, 18, 65, 80, 94, 115, 127, 130, 142, 150, 181, 208, 
            212, 214, 229, 248, 254, 257, 260, 282, 302, 303, 306, 308, 310, 
            319, 323, 334, 354, 359, 362, 373, 376, 380, 381, 382, 383, 384, 
            428, 445, 448, 460, 475, 531, 719
        ]);

        // DOM Elements
        const elLoading = document.getElementById('loading-state');
        const elError = document.getElementById('error-state');
        const elApp = document.getElementById('app-content');
        const elGrid = document.getElementById('pokemon-grid');
        const elEmptyState = document.getElementById('empty-state');
        const elBulkActions = document.getElementById('bulk-actions');
        
        // Progress UI
        const elCaughtCount = document.getElementById('caught-count');
        const elTotalCount = document.getElementById('total-count');
        const elProgressText = document.getElementById('progress-percentage-text');
        const elProgressBar = document.getElementById('progress-bar-fill');
        const elResultsCount = document.getElementById('results-count');
        const elMarkAllBtn = document.getElementById('mark-all-btn');

        function loadProgress() {
            try {
                const multiSaved = localStorage.getItem('pogo-tracker-multi');
                if (multiSaved) {
                    userProgress = JSON.parse(multiSaved);
                    return;
                }

                // Legacy Migration: If user used the previous version of this app
                const legacySaved = localStorage.getItem('pogo-tracker-caught');
                if (legacySaved) {
                    const parsed = JSON.parse(legacySaved);
                    parsed.forEach(id => {
                        userProgress[id] = { regular: true };
                    });
                    saveProgress(); // Immediately save in new format
                }
            } catch (e) {
                console.warn('Failed to load progress', e);
                userProgress = {};
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('pogo-tracker-multi', JSON.stringify(userProgress));
            } catch (e) {
                console.warn('Failed to save progress', e);
            }
        }

        async function fetchPokedex() {
            try {
                const response = await fetch('https://pokemon-go-api.github.io/pokemon-go-api/api/pokedex.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const rawData = await response.json();
                
                let dataArray = Array.isArray(rawData) ? rawData : 
                    (Object.values(rawData).find(val => Array.isArray(val)) || []);

                const uniquePokemon = [];
                const seenDex = new Set();

                dataArray.forEach(p => {
                    const dexNum = p.dexNr || p.dex || p.id || p.pokemonId;
                    let rawName = p.names?.English || p.pokemonName || p.name || 'Unknown';
                    
                    if (dexNum && typeof dexNum === 'number' && dexNum > 0 && !seenDex.has(dexNum)) {
                        seenDex.add(dexNum);
                        const cleanName = rawName.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, l => l.toUpperCase());

                        uniquePokemon.push({
                            id: dexNum,
                            name: cleanName,
                            imageUrl: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${dexNum}.png`,
                            hasMega: megaEligibleIds.has(dexNum)
                        });
                    }
                });

                uniquePokemon.sort((a, b) => a.id - b.id);
                pokemonList = uniquePokemon;
                
                elLoading.classList.add('hidden');
                elApp.classList.remove('hidden');
                elApp.classList.add('flex');
                
                applyFiltersAndSearch();

            } catch (err) {
                console.error("Error fetching Pokemon data:", err);
                elLoading.classList.add('hidden');
                elError.classList.remove('hidden');
                elError.classList.add('flex');
                document.getElementById('error-message').textContent = "Failed to load Pokedex data.";
            }
        }

        // Determines the theme of the active tracking category
        const themeColors = {
            regular:  { bar: 'bg-green-500',   text: 'text-green-600',   cardBg: 'bg-green-50',   cardBorder: 'border-green-400',   iconBg: 'bg-green-500' },
            shiny:    { bar: 'bg-yellow-400',  text: 'text-yellow-600',  cardBg: 'bg-yellow-50',  cardBorder: 'border-yellow-400',  iconBg: 'bg-yellow-500' },
            hundo:    { bar: 'bg-red-500',     text: 'text-red-600',     cardBg: 'bg-red-50',     cardBorder: 'border-red-400',     iconBg: 'bg-red-500' },
            lucky:    { bar: 'bg-orange-400',  text: 'text-orange-600',  cardBg: 'bg-orange-50',  cardBorder: 'border-orange-400',  iconBg: 'bg-orange-500' },
            xxl:      { bar: 'bg-blue-500',    text: 'text-blue-600',    cardBg: 'bg-blue-50',    cardBorder: 'border-blue-400',    iconBg: 'bg-blue-500' },
            xxs:      { bar: 'bg-cyan-500',    text: 'text-cyan-600',    cardBg: 'bg-cyan-50',    cardBorder: 'border-cyan-400',    iconBg: 'bg-cyan-500' },
            shadow:   { bar: 'bg-purple-600',  text: 'text-purple-600',  cardBg: 'bg-purple-50',  cardBorder: 'border-purple-400',  iconBg: 'bg-purple-600' },
            purified: { bar: 'bg-teal-400',    text: 'text-teal-600',    cardBg: 'bg-teal-50',    cardBorder: 'border-teal-400',    iconBg: 'bg-teal-500' },
            mega:     { bar: 'bg-fuchsia-500', text: 'text-fuchsia-600', cardBg: 'bg-fuchsia-50', cardBorder: 'border-fuchsia-400', iconBg: 'bg-fuchsia-500' }
        };

        function updateProgressUI() {
            let totalAvailable = 0;
            let totalCaught = 0;

            pokemonList.forEach(p => {
                // If tracking mega, only count Pokemon that actually have a mega evolution
                if (trackingCategory === 'mega' && !p.hasMega) return;
                
                totalAvailable++;
                if (userProgress[p.id] && userProgress[p.id][trackingCategory]) {
                    totalCaught++;
                }
            });

            const percentage = totalAvailable > 0 ? Math.round((totalCaught / totalAvailable) * 100) : 0;
            const theme = themeColors[trackingCategory] || themeColors.regular;

            elCaughtCount.textContent = totalCaught;
            elTotalCount.textContent = totalAvailable;
            elProgressText.textContent = `${percentage}%`;
            
            // Apply Dynamic Colors to progress bar
            elProgressBar.className = `${theme.bar} h-2.5 rounded-full transition-all duration-500 ease-out`;
            elProgressBar.style.width = `${percentage}%`;
            elProgressText.className = `font-bold ${theme.text}`;
            
            // Extract a clean label for the Mark All button
            const activeTrackBtn = document.querySelector(`.track-btn[data-track="${trackingCategory}"]`);
            const trackLabel = activeTrackBtn ? activeTrackBtn.textContent.replace(/[^a-zA-Z0-9 %]/g, '').trim() : trackingCategory;
            elMarkAllBtn.textContent = `Mark All ${trackLabel}`;
        }

        // Helper to generate an individual attribute chip
        function createChip(id, type, emoji, tooltip, isActive, labelText = null) {
            const activeClasses = isActive 
                ? 'bg-slate-700 text-white border-slate-700 shadow-inner' 
                : 'bg-white text-slate-400 border-slate-200 hover:bg-slate-50';
            
            const content = labelText 
                ? `<span class="text-[9px] font-black tracking-tighter">${labelText}</span>`
                : `<span class="text-[14px] leading-none">${emoji}</span>`;

            return `
                <button data-type="${type}" title="${tooltip}" class="attribute-toggle w-full aspect-square rounded-md flex items-center justify-center border transition-all ${activeClasses}">
                    ${content}
                </button>
            `;
        }

        function createPokemonCard(pokemon) {
            const pState = userProgress[pokemon.id] || {};
            const isTrackingActive = !!pState[trackingCategory];
            const theme = themeColors[trackingCategory] || themeColors.regular;

            // Check for Mastery (100% completion of all available attributes)
            const requiredKeys = ['regular', 'shiny', 'hundo', 'lucky', 'shadow', 'purified', 'xxl', 'xxs'];
            if (pokemon.hasMega) requiredKeys.push('mega');
            const isMastered = requiredKeys.every(key => pState[key]);

            // Main visual styling depends on mastery and currently tracked category
            const cardOutlineClasses = isMastered
                ? 'border-yellow-400 shadow-md shadow-yellow-400/40 scale-[1.02] z-10'
                : (isTrackingActive 
                    ? `${theme.cardBorder} shadow-md scale-[1.01]` 
                    : 'border-transparent shadow-sm hover:shadow hover:-translate-y-0.5');
                    
            const headerBgClasses = isMastered
                ? 'bg-gradient-to-br from-yellow-50 to-amber-100'
                : (isTrackingActive ? theme.cardBg : 'bg-white');
                
            const imgClasses = (isTrackingActive || isMastered) 
                ? 'filter-none scale-110' 
                : 'grayscale-[60%] opacity-80 group-hover:grayscale-0 group-hover:opacity-100';
            
            const badgeIcon = isMastered ? `
                <div class="absolute -top-2 -right-2 bg-gradient-to-br from-yellow-400 to-amber-500 text-white text-[10px] font-black px-2 py-1 rounded-full shadow-md z-20 border-2 border-white transform rotate-12">
                    100%
                </div>
            ` : (isTrackingActive ? `
                <div class="absolute top-2 right-2 ${theme.iconBg} text-white p-1 rounded-full shadow-sm z-10">
                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            ` : '');

            // 8 Slot Grid for Attributes
            const chipsHtml = `
                ${createChip(pokemon.id, 'shiny', '✨', 'Shiny', pState.shiny)}
                ${createChip(pokemon.id, 'hundo', '💯', '100% IV', pState.hundo)}
                ${createChip(pokemon.id, 'lucky', '🍀', 'Lucky', pState.lucky)}
                ${createChip(pokemon.id, 'shadow', '😈', 'Shadow', pState.shadow)}
                ${createChip(pokemon.id, 'xxl', '', 'XXL', pState.xxl, 'XXL')}
                ${createChip(pokemon.id, 'xxs', '', 'XXS', pState.xxs, 'XXS')}
                ${createChip(pokemon.id, 'purified', '🕊️', 'Purified', pState.purified)}
                ${pokemon.hasMega 
                    ? createChip(pokemon.id, 'mega', '🧬', 'Mega Evolution', pState.mega) 
                    : `<div class="w-full aspect-square bg-transparent"></div>` // Empty placeholder to maintain grid
                }
            `;

            return `
                <div data-id="${pokemon.id}" class="pokemon-card group relative bg-white border-2 rounded-xl flex flex-col overflow-hidden transition-all duration-200 select-none ${cardOutlineClasses}">
                    
                    <!-- Main Clickable Area (Toggles the specific dropdown category) -->
                    <div class="main-toggle cursor-pointer flex flex-col items-center p-3 relative flex-1 ${headerBgClasses}">
                        <div class="absolute top-2 left-2 text-[10px] font-black px-1.5 py-0.5 rounded ${isTrackingActive || isMastered ? 'text-slate-700 bg-black/10' : 'text-slate-400 bg-slate-100'}">
                            #${String(pokemon.id).padStart(3, '0')}
                        </div>
                        
                        ${badgeIcon}

                        <div class="w-16 h-16 sm:w-20 sm:h-20 mt-3 mb-2 relative flex items-center justify-center">
                            <img src="${pokemon.imageUrl}" alt="${pokemon.name}" loading="lazy" class="max-w-full max-h-full object-contain drop-shadow-sm transition-all duration-300 ${imgClasses}" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.id}.png';"/>
                        </div>

                        <h3 class="text-xs sm:text-sm font-bold text-center w-full truncate px-1 text-slate-700">
                            ${pokemon.name}
                        </h3>
                    </div>

                    <!-- 4x2 Attribute Grid -->
                    <div class="grid grid-cols-4 gap-1 p-1.5 bg-slate-100 border-t border-slate-200 shrink-0">
                        ${chipsHtml}
                    </div>
                </div>
            `;
        }

        function renderGrid() {
            if (filteredList.length === 0) {
                elGrid.innerHTML = '';
                elEmptyState.classList.remove('hidden');
                elBulkActions.classList.add('hidden');
                return;
            }

            elEmptyState.classList.add('hidden');
            
            if (searchTerm || filterMode !== 'all' || trackingCategory !== 'regular') {
                elBulkActions.classList.remove('hidden');
                elBulkActions.classList.add('flex');
                elResultsCount.textContent = `Showing ${filteredList.length} results`;
            } else {
                elBulkActions.classList.add('hidden');
                elBulkActions.classList.remove('flex');
            }

            elGrid.innerHTML = filteredList.map(p => createPokemonCard(p)).join('');
        }

        function applyFiltersAndSearch() {
            const term = searchTerm.toLowerCase();
            
            filteredList = pokemonList.filter(pokemon => {
                // 1. If tracking mega globally, filter out non-megas to keep list clean
                if (trackingCategory === 'mega' && !pokemon.hasMega) return false;

                // 2. Search
                const matchesSearch = pokemon.name.toLowerCase().includes(term) || pokemon.id.toString().includes(term);
                if (!matchesSearch) return false;

                // 3. Status Filter (All/Caught/Missing) -> relies on currently tracked category
                if (filterMode !== 'all') {
                    const hasAttribute = userProgress[pokemon.id] && userProgress[pokemon.id][trackingCategory];
                    if (filterMode === 'caught' && !hasAttribute) return false;
                    if (filterMode === 'missing' && hasAttribute) return false;
                }

                return true;
            });

            renderGrid();
            updateProgressUI();
        }

        function toggleAttribute(id, attributeKey, cardElement = null) {
            if (!userProgress[id]) userProgress[id] = {};
            userProgress[id][attributeKey] = !userProgress[id][attributeKey];
            saveProgress();
            
            // Fast DOM Update: Replace only the clicked card's HTML to prevent full grid image reloads
            if (cardElement) {
                const p = pokemonList.find(x => x.id === id);
                cardElement.outerHTML = createPokemonCard(p);
                
                // Recalculate filteredList quietly to maintain accurate counts for bulk actions
                const term = searchTerm.toLowerCase();
                filteredList = pokemonList.filter(pokemon => {
                    if (trackingCategory === 'mega' && !pokemon.hasMega) return false;
                    const matchesSearch = pokemon.name.toLowerCase().includes(term) || pokemon.id.toString().includes(term);
                    if (!matchesSearch) return false;
                    if (filterMode !== 'all') {
                        const hasAttribute = userProgress[pokemon.id] && userProgress[pokemon.id][trackingCategory];
                        if (filterMode === 'caught' && !hasAttribute) return false;
                        if (filterMode === 'missing' && hasAttribute) return false;
                    }
                    return true;
                });
                
                // If the filter dictates this card should no longer be visible, hide it
                const newCardNode = elGrid.querySelector(`.pokemon-card[data-id="${id}"]`);
                if (newCardNode) {
                    const shouldBeVisible = filteredList.some(f => f.id === id);
                    if (!shouldBeVisible) newCardNode.classList.add('hidden');
                }

                // Update Progress Bar and Context Menu seamlessly
                updateProgressUI();
                if (searchTerm || filterMode !== 'all' || trackingCategory !== 'regular') {
                    elResultsCount.textContent = `Showing ${filteredList.length} results`;
                }
            } else {
                // Fallback for bulk actions or initialization
                applyFiltersAndSearch(); 
            }
        }

        // Event Delegation for clicking elements inside the grid
        elGrid.addEventListener('click', (e) => {
            // Did they click a mini attribute chip?
            const attrBtn = e.target.closest('.attribute-toggle');
            if (attrBtn) {
                e.stopPropagation(); // prevent main card click
                const card = attrBtn.closest('.pokemon-card');
                const id = parseInt(card.dataset.id, 10);
                const type = attrBtn.dataset.type;
                toggleAttribute(id, type, card);
                return;
            }

            // Did they click the main card area?
            const mainToggle = e.target.closest('.main-toggle');
            if (mainToggle) {
                const card = mainToggle.closest('.pokemon-card');
                const id = parseInt(card.dataset.id, 10);
                // The main card area always toggles the active tracking category!
                toggleAttribute(id, trackingCategory, card);
            }
        });

        // Search Input Listener
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            applyFiltersAndSearch();
        });

        // Filter Buttons Listeners (All / Caught / Missing)
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.className = "filter-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0";
                });
                e.target.className = "filter-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all bg-white text-blue-600 shadow-sm shrink-0";
                filterMode = e.target.dataset.filter;
                applyFiltersAndSearch();
            });
        });

        // Tracking Category Buttons Listeners (Regular, Shiny, etc.)
        document.querySelectorAll('.track-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.track-btn').forEach(b => {
                    b.className = "track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0";
                });
                e.target.className = "track-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all bg-white text-slate-800 shadow-sm shrink-0";
                trackingCategory = e.target.dataset.track;
                applyFiltersAndSearch();
            });
        });

        // Mark All Actions
        elMarkAllBtn.addEventListener('click', () => {
            filteredList.forEach(p => {
                if (!userProgress[p.id]) userProgress[p.id] = {};
                userProgress[p.id][trackingCategory] = true;
            });
            saveProgress();
            applyFiltersAndSearch();
        });

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadProgress();
            fetchPokedex();
        });
    </script>
</body>
</html>
