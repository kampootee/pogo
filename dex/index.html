<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon GO Completion Tracker</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20 min-h-screen flex flex-col">

    <div id="loading-state" class="flex-1 flex flex-col items-center justify-center p-4 min-h-screen">
        <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-lg text-slate-600 font-medium">Loading Pokedex Data...</p>
    </div>

    <div id="error-state" class="hidden flex-1 flex-col items-center justify-center p-4 min-h-screen">
        <div class="bg-red-50 border-l-4 border-red-500 p-6 rounded-lg max-w-md w-full shadow-sm">
            <h3 class="text-red-800 font-bold text-lg mb-2">Error Loading Data</h3>
            <p id="error-message" class="text-red-600"></p>
        </div>
    </div>

    <div id="app-content" class="hidden flex-col">
        <!-- Sticky Header -->
        <header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md shadow-sm border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                    
                    <!-- Title and Progress Text -->
                    <div class="flex-1">
                        <h1 class="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-sm">
                                GO
                            </div>
                            Completion Tracker
                        </h1>
                        <div class="mt-2 flex items-center gap-3">
                            <span class="text-sm font-semibold text-slate-500">
                                Caught: <span id="caught-count" class="text-slate-800">0</span> / <span id="total-count">0</span>
                            </span>
                            <span id="progress-percentage-text" class="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">
                                0%
                            </span>
                        </div>
                    </div>

                    <!-- Progress Bar Visual -->
                    <div class="w-full md:w-1/3 bg-slate-200 rounded-full h-3 overflow-hidden">
                        <div id="progress-bar-fill" class="bg-gradient-to-r from-green-400 to-emerald-500 h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Controls: Search and Filters -->
                <div class="mt-4 flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input
                            type="text"
                            id="search-input"
                            placeholder="Search by name or number..."
                            class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-transparent rounded-lg focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-colors text-slate-700 placeholder-slate-400 outline-none"
                        />
                    </div>
                    
                    <div class="flex items-center gap-2 p-1 bg-slate-100 rounded-lg overflow-x-auto" id="filter-buttons">
                        <svg class="w-4 h-4 ml-2 text-slate-400 hidden sm:block shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                        </svg>
                        <button data-filter="all" class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all bg-white text-blue-600 shadow-sm shrink-0">All</button>
                        <button data-filter="caught" class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">Caught</button>
                        <button data-filter="missing" class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0">Missing</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
            
            <!-- Bulk Action Context Menu -->
            <div id="bulk-actions" class="hidden mb-4 items-center justify-between bg-blue-50 p-3 rounded-lg border border-blue-100">
                <span id="results-count" class="text-sm text-blue-800 font-medium"></span>
                <div class="flex gap-2">
                    <button id="mark-all-btn" class="text-xs font-semibold bg-white border border-blue-200 text-blue-600 px-3 py-1.5 rounded hover:bg-blue-100 transition-colors">
                        Mark All Caught
                    </button>
                </div>
            </div>

            <div id="empty-state" class="hidden text-center py-20">
                <div class="inline-block p-6 bg-white rounded-full shadow-sm mb-4">
                    <svg class="w-10 h-10 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <h2 class="text-xl font-semibold text-slate-700">No Pokémon found</h2>
                <p class="text-slate-500 mt-1">Try adjusting your search or filters.</p>
            </div>

            <!-- Pokemon Grid -->
            <div id="pokemon-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                <!-- Javascript will inject cards here -->
            </div>
        </main>
    </div>

    <script>
        // State
        let pokemonList = [];
        let filteredList = [];
        let caughtIds = new Set();
        let searchTerm = '';
        let filterMode = 'all';

        // DOM Elements
        const elLoading = document.getElementById('loading-state');
        const elError = document.getElementById('error-state');
        const elApp = document.getElementById('app-content');
        const elGrid = document.getElementById('pokemon-grid');
        const elEmptyState = document.getElementById('empty-state');
        const elBulkActions = document.getElementById('bulk-actions');
        
        // Progress UI
        const elCaughtCount = document.getElementById('caught-count');
        const elTotalCount = document.getElementById('total-count');
        const elProgressText = document.getElementById('progress-percentage-text');
        const elProgressBar = document.getElementById('progress-bar-fill');
        const elResultsCount = document.getElementById('results-count');

        // Initialize Local Storage
        function loadProgress() {
            try {
                const saved = localStorage.getItem('pogo-tracker-caught');
                if (saved) {
                    caughtIds = new Set(JSON.parse(saved));
                }
            } catch (e) {
                console.warn('Failed to load progress from localStorage', e);
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('pogo-tracker-caught', JSON.stringify(Array.from(caughtIds)));
            } catch (e) {
                console.warn('Failed to save progress to localStorage', e);
            }
        }

        async function fetchPokedex() {
            try {
                const response = await fetch('https://pokemon-go-api.github.io/pokemon-go-api/api/pokedex.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const rawData = await response.json();
                
                let dataArray = [];
                if (Array.isArray(rawData)) {
                    dataArray = rawData;
                } else if (typeof rawData === 'object' && rawData !== null) {
                    const foundArray = Object.values(rawData).find(val => Array.isArray(val));
                    if (foundArray) dataArray = foundArray;
                }

                const uniquePokemon = [];
                const seenDex = new Set();

                dataArray.forEach(p => {
                    const dexNum = p.dex || p.id || p.pokemonId;
                    const rawName = p.pokemonName || p.name || p.formId || 'Unknown';
                    
                    if (typeof dexNum === 'number' && dexNum > 0 && !seenDex.has(dexNum)) {
                        seenDex.add(dexNum);
                        
                        const cleanName = rawName
                            .replace(/_/g, ' ')
                            .toLowerCase()
                            .replace(/\b\w/g, l => l.toUpperCase());

                        uniquePokemon.push({
                            id: dexNum,
                            name: cleanName,
                            imageUrl: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${dexNum}.png`
                        });
                    }
                });

                uniquePokemon.sort((a, b) => a.id - b.id);
                pokemonList = uniquePokemon;
                
                // Switch UI from loading to app
                elLoading.classList.add('hidden');
                elApp.classList.remove('hidden');
                elApp.classList.add('flex');
                
                applyFiltersAndSearch();

            } catch (err) {
                console.error("Error fetching Pokemon data:", err);
                elLoading.classList.add('hidden');
                elError.classList.remove('hidden');
                elError.classList.add('flex');
                document.getElementById('error-message').textContent = "Failed to load Pokedex data. Please check your connection or the API URL.";
            }
        }

        function updateProgressUI() {
            const totalAvailable = pokemonList.length;
            const totalCaught = caughtIds.size;
            const percentage = totalAvailable > 0 ? Math.round((totalCaught / totalAvailable) * 100) : 0;

            elCaughtCount.textContent = totalCaught;
            elTotalCount.textContent = totalAvailable;
            elProgressText.textContent = `${percentage}%`;
            elProgressBar.style.width = `${percentage}%`;
        }

        function createPokemonCard(pokemon, isCaught) {
            // Using template literals to create the HTML string for performance
            const paddedId = String(pokemon.id).padStart(3, '0');
            const bgClasses = isCaught 
                ? 'bg-gradient-to-b from-white to-green-50 border-2 border-green-400 shadow-[0_4px_12px_rgba(74,222,128,0.15)] scale-[1.02] sm:scale-100 sm:hover:scale-105' 
                : 'bg-white border-2 border-transparent shadow-sm hover:shadow-md hover:border-slate-200 hover:-translate-y-1';
            
            const badgeClasses = isCaught ? 'text-green-700 bg-green-100' : 'text-slate-400 bg-slate-100';
            const imgClasses = isCaught ? 'filter-none scale-110' : 'grayscale-[80%] opacity-70 group-hover:grayscale-0 group-hover:opacity-100';
            const textClasses = isCaught ? 'text-slate-800' : 'text-slate-500 group-hover:text-slate-800';
            
            const checkIcon = isCaught ? `
                <div class="absolute top-2 right-2 bg-green-500 text-white p-1 rounded-full shadow-sm animate-[bounce_0.3s_ease-out_1]">
                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            ` : '';

            // Note: fallback image logic is handled directly in the onerror attribute
            return `
                <div 
                    data-id="${pokemon.id}"
                    class="pokemon-card relative group cursor-pointer rounded-2xl p-4 flex flex-col items-center transition-all duration-200 select-none overflow-hidden ${bgClasses}"
                >
                    <div class="absolute top-2 left-2 text-xs font-black px-1.5 py-0.5 rounded ${badgeClasses}">
                        #${paddedId}
                    </div>
                    
                    ${checkIcon}

                    <div class="w-24 h-24 mt-2 mb-3 relative flex items-center justify-center">
                        <img
                            src="${pokemon.imageUrl}"
                            alt="${pokemon.name}"
                            loading="lazy"
                            class="max-w-full max-h-full object-contain drop-shadow-sm transition-all duration-300 ${imgClasses}"
                            onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.id}.png';"
                        />
                    </div>

                    <h3 class="text-sm font-bold text-center w-full truncate px-1 transition-colors ${textClasses}">
                        ${pokemon.name}
                    </h3>
                </div>
            `;
        }

        function renderGrid() {
            if (filteredList.length === 0) {
                elGrid.innerHTML = '';
                elEmptyState.classList.remove('hidden');
                elBulkActions.classList.add('hidden');
                return;
            }

            elEmptyState.classList.add('hidden');
            
            // Show bulk actions if filtering or searching
            if (searchTerm || filterMode !== 'all') {
                elBulkActions.classList.remove('hidden');
                elBulkActions.classList.add('flex');
                elResultsCount.textContent = `Showing ${filteredList.length} results`;
            } else {
                elBulkActions.classList.add('hidden');
                elBulkActions.classList.remove('flex');
            }

            // Build HTML efficiently
            const htmlStr = filteredList.map(p => createPokemonCard(p, caughtIds.has(p.id))).join('');
            elGrid.innerHTML = htmlStr;
        }

        function applyFiltersAndSearch() {
            const term = searchTerm.toLowerCase();
            
            filteredList = pokemonList.filter(pokemon => {
                // Search
                const matchesSearch = pokemon.name.toLowerCase().includes(term) || pokemon.id.toString().includes(term);
                if (!matchesSearch) return false;

                // Filter
                const isCaught = caughtIds.has(pokemon.id);
                if (filterMode === 'caught' && !isCaught) return false;
                if (filterMode === 'missing' && isCaught) return false;

                return true;
            });

            renderGrid();
            updateProgressUI();
        }

        function togglePokemon(id) {
            if (caughtIds.has(id)) {
                caughtIds.delete(id);
            } else {
                caughtIds.add(id);
            }
            saveProgress();
            
            // If we are filtering, we need to re-evaluate the list
            // Otherwise, we could just update the specific DOM node for speed, 
            // but re-rendering the filtered list is safer and keeps UI in sync easily.
            applyFiltersAndSearch(); 
        }

        // Event Delegation for clicking cards
        elGrid.addEventListener('click', (e) => {
            const card = e.target.closest('.pokemon-card');
            if (card) {
                const id = parseInt(card.dataset.id, 10);
                togglePokemon(id);
            }
        });

        // Search Input
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            applyFiltersAndSearch();
        });

        // Filter Buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Update active state visuals
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.className = "filter-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 shrink-0";
                });
                
                e.target.className = "filter-btn px-4 py-1.5 rounded-md text-sm font-medium capitalize transition-all bg-white text-blue-600 shadow-sm shrink-0";
                
                filterMode = e.target.dataset.filter;
                applyFiltersAndSearch();
            });
        });

        // Mark All Caught Button
        document.getElementById('mark-all-btn').addEventListener('click', () => {
            filteredList.forEach(p => caughtIds.add(p.id));
            saveProgress();
            applyFiltersAndSearch();
        });

        // App Initialization
        function init() {
            loadProgress();
            fetchPokedex();
        }

        // Start the app when DOM is ready
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
